<script id="reading-polish-script">

(() => {
  'use strict';
  const storageKey = 'network-reading-preferences-v2';
  const themes = {dark:'กลางคืน', light:'สว่าง', paper:'กระดาษ'};
  const sizes = {normal:'ปกติ', large:'ใหญ่', largest:'ใหญ่พิเศษ'};
  const steps = {normal:0, large:2, largest:4};
  function preferences(raw) {
    let saved;
    try { saved = JSON.parse(raw); } catch {}
    return {
      theme:Object.hasOwn(themes,saved?.theme) ? saved.theme : 'dark',
      size:Object.hasOwn(sizes,saved?.size) ? saved.size : saved?.large === true ? 'large' : 'normal'
    };
  }
  let raw;
  try { raw = localStorage.getItem(storageKey); } catch {}
  const settings = preferences(raw);
  function apply() {
    const root = document.documentElement;
    root.dataset.theme = settings.theme;
    root.style.setProperty('--reading-size',(16 + steps[settings.size]) + 'px');
    root.style.setProperty('--font-step',steps[settings.size] + 'px');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = {dark:'#101a23',light:'#eef3f5',paper:'#eee8dc'}[settings.theme];
  }
  apply();
  document.addEventListener('DOMContentLoaded', () => {
    const header = document.querySelector('.topbar');
    const main = document.getElementById('main');
    if (!header || !main) return;
    const actions = document.createElement('div');
    actions.className = 'reader-actions';
    actions.setAttribute('role','group');
    actions.setAttribute('aria-label','เครื่องมือการอ่าน');
    header.append(actions);
    let opened = null;
    function closePanel(restoreFocus = false) {
      if (!opened) return;
      opened.panel.hidden = true;
      opened.button.setAttribute('aria-expanded','false');
      if (restoreFocus) opened.button.focus();
      opened = null;
    }
    function chooseControl(key,label,values,iconText) {
      const wrapper = document.createElement('div');
      wrapper.className = 'reader-control';
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'reader-trigger';
      const symbol = document.createElement('span');
      symbol.className = 'reader-symbol';
      symbol.setAttribute('aria-hidden','true');
      symbol.textContent = iconText;
      const caption = document.createElement('span');
      caption.textContent = label;
      button.append(symbol,caption);
      const panel = document.createElement('div');
      panel.className = 'reader-panel';
      panel.id = 'reader-options-' + key;
      panel.hidden = true;
      panel.setAttribute('role','group');
      panel.setAttribute('aria-label',label);
      button.setAttribute('aria-controls',panel.id);
      button.setAttribute('aria-expanded','false');
      const options = Object.entries(values).map(([value,name]) => {
        const choice = document.createElement('button');
        choice.type = 'button';
        choice.className = 'reader-choice';
        choice.dataset.value = value;
        choice.textContent = name;
        choice.addEventListener('click',() => {
          settings[key] = value;
          apply();
          try { localStorage.setItem(storageKey,JSON.stringify(settings)); } catch {}
          sync();
          closePanel(true);
          scheduleScroll();
        });
        panel.append(choice);
        return choice;
      });
      function sync() {
        button.title = label + ' · ' + values[settings[key]];
        button.setAttribute('aria-label',button.title);
        options.forEach(choice => choice.setAttribute('aria-pressed',String(choice.dataset.value === settings[key])));
      }
      button.addEventListener('click',() => {
        const opening = panel.hidden;
        closePanel();
        if (!opening) return;
        panel.hidden = false;
        button.setAttribute('aria-expanded','true');
        opened = {wrapper,button,panel};
        options.find(choice => choice.dataset.value === settings[key])?.focus();
      });
      wrapper.append(button,panel);
      actions.append(wrapper);
      sync();
    }
    chooseControl('theme','ธีม',themes,'◐');
    chooseControl('size','ตัวอักษร',sizes,'ก');
    document.addEventListener('pointerdown',event => {
      if (opened && !opened.wrapper.contains(event.target)) closePanel();
    });
    document.addEventListener('focusin',event => {
      if (opened && !opened.wrapper.contains(event.target)) closePanel();
    });
    document.addEventListener('keydown',event => {
      if (event.key === 'Escape' && opened) { event.preventDefault(); closePanel(true); }
    });
    const topButton = document.createElement('button');
    topButton.type = 'button';
    topButton.className = 'reader-top';
    topButton.textContent = '↑  ขึ้นบน';
    topButton.hidden = true;
    topButton.setAttribute('aria-label','กลับขึ้นด้านบน');
    topButton.addEventListener('click',() => window.scrollTo({
      top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'
    }));
    document.body.append(topButton);
    const progress = document.createElement('div');
    progress.className = 'reading-progress';
    progress.setAttribute('aria-hidden','true');
    const fill = document.createElement('span');
    progress.append(fill);
    document.body.append(progress);
    let sections = [];
    let sectionLinks = [];
    let active = -1;
    let frame = 0;
    function updateScroll() {
      frame = 0;
      const offset = header.offsetHeight + 18;
      topButton.hidden = window.scrollY < Math.max(380,window.innerHeight * .7);
      const article = main.querySelector('.reading');
      progress.hidden = !article;
      if (!article) return;
      const box = article.getBoundingClientRect();
      const length = box.height - window.innerHeight + offset;
      const ratio = length > 0 ? Math.max(0,Math.min(1,(offset-box.top)/length)) : 1;
      fill.style.transform = 'scaleX('+ratio+')';
      let current = 0;
      for (let index = 1; index < sections.length; index++) {
        if (sections[index].getBoundingClientRect().top > offset + 10) break;
        current = index;
      }
      if (sections.length && current !== active) {
        sectionLinks[active]?.removeAttribute('aria-current');
        sectionLinks[current]?.setAttribute('aria-current','location');
        active = current;
      }
    }
    function scheduleScroll() {
      if (!frame) frame = requestAnimationFrame(updateScroll);
    }
    window.addEventListener('scroll',scheduleScroll,{passive:true});
    window.addEventListener('resize',scheduleScroll);
    function navigation(original,items) {
      // Rebuild only the topic navigation. Whole-chapter actions live in .chapter-end.
      const aside = document.createElement('aside');
      aside.className = 'lesson-contents';
      aside.setAttribute('aria-label','สารบัญในบท');
      const details = document.createElement('details');
      details.open = !matchMedia('(max-width:900px)').matches;
      const title = document.createElement('summary');
      title.textContent = 'เนื้อหาในบทนี้';
      const list = document.createElement('ol');
      sectionLinks = items.map(section => {
        const name = section.querySelector('h2,h3')?.textContent.trim().replace(/^\s*\d+[.)]\s*/,'');
        const row = document.createElement('li');
        const link = document.createElement('a');
        link.href = '#' + section.id;
        link.textContent = name || section.id;
        link.addEventListener('click',event => {
          event.preventDefault();
          const y = window.scrollY + section.getBoundingClientRect().top - header.offsetHeight - 18;
          window.scrollTo({top:y,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
        });
        row.append(link);
        list.append(row);
        return link;
      });
      details.append(title,list);
      aside.append(details);
      const quiz = original.querySelector('[data-start]');
      if (quiz) aside.append(quiz);
      original.replaceWith(aside);
    }
    function refresh() {
      const previous = main.querySelector('.toc');
      sections = [...main.querySelectorAll('.reading .lesson-section[id]')];
      for (const section of sections) {
        // Some expanded chapters include a manual read toggle beside the heading.
        // Keep simulation, copy and quiz buttons available.
        for (const control of section.querySelectorAll('button, label, input[type="checkbox"], [role="checkbox"]')) {
          const action = [control.getAttribute('aria-label'),control.title,control.textContent,
            control.getAttribute('name'),control.getAttribute('class')].filter(Boolean).join(' ');
          if (/อ่าน(?:หัวข้อ|เรื่อง|ส่วน|เนื้อหา|บทเรียน|นี้|จบ|เสร็จ|แล้ว).*?(?:แล้ว|เสร็จ|จบ)|อ่าน(?:แล้ว|เสร็จ|จบ)|ทำเครื่องหมาย.*อ่าน|mark.*(?:read|complete)|(?:section|topic)[-_](?:check|done|complete)/i.test(action)) {
            control.remove();
          }
        }
      }
      if (previous && sections.length) {
        // Include additional linked sections supplied by a chapter extension.
        const extra = [...previous.querySelectorAll('[data-scroll]')].map(link=>document.getElementById(link.dataset.scroll));
        sections = [...new Set([...sections,...extra.filter(section=>section && main.contains(section) && section.querySelector('h2,h3'))])];
        sections.sort((a,b)=>a===b?0:a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING?-1:1);
        navigation(previous,sections);
      } else if (!main.querySelector('.lesson-contents')) {
        sectionLinks = [];
      }
      active = -1;
      scheduleScroll();
    }
    let refreshFrame = 0;
    const queueRefresh = () => {
      cancelAnimationFrame(refreshFrame);
      refreshFrame = requestAnimationFrame(refresh);
    };
    new MutationObserver(queueRefresh).observe(main,{childList:true});
    window.addEventListener('hashchange',() => closePanel());
    queueRefresh();
  },{once:true});
})();

</script>

<script id="network-motion-script">

(() => {
  'use strict';
  const motionKey='network-motion-preference-v1';
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  let enabled=true;
  try { enabled=localStorage.getItem(motionKey)!=='off'; } catch {}
  document.documentElement.dataset.motion=enabled?'on':'off';
  const canAnimate=()=>enabled&&!reduced.matches&&typeof Element.prototype.animate==='function';
  document.addEventListener('DOMContentLoaded',()=>{
    const main=document.getElementById('main');
    if(!main)return;
    const tools=document.querySelector('.reader-actions');
    if(tools) {
      const toggle=document.createElement('button');
      toggle.type='button';
      toggle.className='fx-motion-button';
      toggle.setAttribute('aria-label','เปิดหรือปิดแอนิเมชัน');
      toggle.setAttribute('aria-pressed',String(enabled));
      toggle.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4L12 3Z"/></svg><span>ลูกเล่น</span>';
      tools.append(toggle);
      toggle.addEventListener('click',()=>{
        enabled=!enabled;
        document.documentElement.dataset.motion=enabled?'on':'off';
        toggle.setAttribute('aria-pressed',String(enabled));
        try{localStorage.setItem(motionKey,enabled?'on':'off');}catch{}
        if(!enabled) main.getAnimations?.({subtree:true})?.forEach(a=>a.cancel());
      });
    }
    let revealObserver;
    let previousView='';
    let lastFeedback='';
    let lastResult='';
    let pending=false;
    const animate=(element,keyframes,options)=>{
      if(!canAnimate()||!element)return;
      return element.animate(keyframes,{duration:450,easing:'cubic-bezier(.22,.72,.2,1)',...options});
    };
    function routeLine() {
      if(!canAnimate())return;
      document.querySelectorAll('.fx-route-line').forEach(el=>el.remove());
      const line=document.createElement('div');
      line.className='fx-route-line';line.setAttribute('aria-hidden','true');
      document.body.append(line);
      const a=line.animate([
        {transform:'scaleX(0)',opacity:1,offset:0},
        {transform:'scaleX(.65)',opacity:1,offset:.5},
        {transform:'scaleX(1)',opacity:1,offset:.85},
        {transform:'scaleX(1)',opacity:0,offset:1}
      ],{duration:580,easing:'ease-out'});
      a.onfinish=()=>line.remove();
    }
    function packets() {
      const svg=main.querySelector('.hero-art svg');
      if(!svg||svg.querySelector('.fx-packets'))return;
      const ns='http://www.w3.org/2000/svg';
      const group=document.createElementNS(ns,'g');
      group.classList.add('fx-packets');group.setAttribute('aria-hidden','true');
      [...svg.querySelectorAll('line')].forEach((line,index)=>{
        const circle=document.createElementNS(ns,'circle');
        circle.setAttribute('r','3.5');circle.setAttribute('fill','#1a9d89');
        const motion=document.createElementNS(ns,'animateMotion');
        motion.setAttribute('path','M'+line.getAttribute('x1')+' '+line.getAttribute('y1')+' L'+line.getAttribute('x2')+' '+line.getAttribute('y2'));
        motion.setAttribute('dur',(2.6+index*.19)+'s');
        motion.setAttribute('begin',(-index*.7)+'s');
        motion.setAttribute('repeatCount','indefinite');
        circle.append(motion);group.append(circle);
      });
      svg.append(group);
    }
    function celebrate(element,large) {
      if(!canAnimate()||!element)return;
      const rect=element.getBoundingClientRect();
      const x=Math.max(25,Math.min(innerWidth-25,rect.left+rect.width/2));
      const y=Math.max(80,Math.min(innerHeight-80,rect.top+Math.min(60,rect.height/2)));
      const colors=['#1d927c','#56c9ab','#5d9ede','#d8ad59'];
      const count=large?34:12;
      for(let i=0;i<count;i++){
        const bit=document.createElement('i');
        bit.className='fx-piece';bit.setAttribute('aria-hidden','true');
        bit.style.left=x+'px';bit.style.top=y+'px';bit.style.background=colors[i%colors.length];
        document.body.append(bit);
        const direction=(Math.PI*2*i/count)-Math.PI/2;
        const distance=large?90+Math.random()*100:35+Math.random()*55;
        const dx=Math.cos(direction)*distance;
        const dy=Math.sin(direction)*distance;
        const spin=(Math.random()-.5)*650;
        const a=bit.animate([
          {transform:'translate(0,0) rotate(0deg) scale(.3)',opacity:0},
          {transform:'translate('+dx*.55+'px,'+(dy*.7-30)+'px) rotate('+spin*.5+'deg) scale(1)',opacity:1,offset:.35},
          {transform:'translate('+dx+'px,'+(dy+100)+'px) rotate('+spin+'deg) scale(.6)',opacity:0}
        ],{duration:large?1250:850,easing:'cubic-bezier(.2,.6,.35,1)',delay:i*7});
        a.onfinish=()=>bit.remove();
      }
    }
    function sectionReveals() {
      revealObserver?.disconnect();
      if(!canAnimate()||!('IntersectionObserver' in window))return;
      revealObserver=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(!entry.isIntersecting)return;
          revealObserver.unobserve(entry.target);
          animate(entry.target,[{opacity:.45,transform:'translateY(15px)'},{opacity:1,transform:'translateY(0)'}],{duration:520});
        });
      },{threshold:.04,rootMargin:'0px 0px -30px 0px'});
      main.querySelectorAll('.lesson-section').forEach(section=>revealObserver.observe(section));
    }
    function refresh() {
      pending=false;
      const heading=main.querySelector('h1')?.textContent||'';
      const view=location.hash+'|'+heading;
      if(view!==previousView){
        previousView=view;lastFeedback='';lastResult='';
        routeLine();
        animate(main.querySelector('.page-head')||main.querySelector('.hero'),[
          {opacity:.3,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}
        ],{duration:460});
        main.querySelectorAll('.chapter-card,.quiz-choice').forEach((card,index)=>{
          animate(card,[{opacity:.2,transform:'translateY(20px) scale(.98)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:460,delay:Math.min(index,7)*55});
        });
        packets();
        sectionReveals();
      }
      const question=main.querySelector('.question-panel h2')?.textContent||'';
      const feedback=main.querySelector('.feedback');
      const feedbackId=question+'|'+(feedback?.textContent||'');
      if(feedback&&feedbackId!==lastFeedback){
        lastFeedback=feedbackId;
        animate(feedback,[{opacity:0,transform:'translateY(10px) scale(.985)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:350});
        const chosen=main.querySelector('.option.selected');
        if(feedback.classList.contains('wrong')){
          animate(chosen,[{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:260});
        }else celebrate(feedback,false);
      }
      if(!feedback)lastFeedback='';
      const result=main.querySelector('.result-head');
      const resultId=result?.textContent||'';
      if(result&&resultId!==lastResult){
        lastResult=resultId;
        animate(result.querySelector('.score-circle'),[{transform:'scale(.65)',opacity:0},{transform:'scale(1.06)',opacity:1,offset:.75},{transform:'scale(1)',opacity:1}],{duration:620});
        if(parseInt(result.querySelector('.score-circle b')?.textContent,10)>=80)celebrate(result,true);
      }
    }
    const queueRefresh=()=>{if(!pending){pending=true;requestAnimationFrame(refresh);}};
    new MutationObserver(queueRefresh).observe(main,{childList:true});
    document.addEventListener('pointermove',event=>{
      if(!canAnimate()||event.pointerType!=='mouse')return;
      const card=event.target.closest('.chapter-card');
      if(!card)return;
      const rect=card.getBoundingClientRect();
      const x=(event.clientX-rect.left)/rect.width;
      const y=(event.clientY-rect.top)/rect.height;
      card.style.setProperty('--fx-x',Math.round(x*100)+'%');
      card.style.setProperty('--fx-y',Math.round(y*100)+'%');
      card.style.setProperty('--fx-rx',((.5-y)*3.5).toFixed(2)+'deg');
      card.style.setProperty('--fx-ry',((x-.5)*4).toFixed(2)+'deg');
      card.classList.add('fx-hover');
    },{passive:true});
    document.addEventListener('pointerout',event=>{
      const card=event.target.closest('.chapter-card');
      if(card&&!card.contains(event.relatedTarget))card.classList.remove('fx-hover');
    },{passive:true});
    document.addEventListener('pointerdown',event=>{
      if(!canAnimate()||!event.target.closest('.btn,.option,.chapter-card'))return;
      const wave=document.createElement('span');wave.className='fx-click-wave';
      wave.setAttribute('aria-hidden','true');wave.style.left=event.clientX+'px';wave.style.top=event.clientY+'px';
      document.body.append(wave);
      wave.addEventListener('animationend',()=>wave.remove(),{once:true});
      setTimeout(()=>wave.remove(),700);
    },{passive:true});
    refresh();
  },{once:true});
})();

</script>

<script id="practical-progress-colors-script">
(() => {
  'use strict';
  function initializeProgressColors() {
    const main = document.getElementById('main') || document.querySelector('main');
    if (!main) return;
    function findPanel(label) {
      let node = label.parentElement;
      for (let depth=0; node && node!==main && depth<5; depth++,node=node.parentElement) {
        const content = node.textContent || '';
        if (content.length > 1800) return null;
        if (content.includes('กำลังอ่าน') && /อ่านแล้ว\s*\d/.test(content)) return node;
      }
      return null;
    }
    function refresh() {
      pending = false;
      for (const label of main.querySelectorAll('h2,h3,h4,p,span,strong,small,div')) {
        if (label.textContent.trim() !== 'ความคืบหน้าในบทนี้') continue;
        const panel = findPanel(label);
        if (!panel) continue;
        panel.setAttribute('data-reading-progress-panel','');
        label.setAttribute('data-progress-caption','');
      }
    }
    let pending = false;
    new MutationObserver(() => {
      if (pending) return;
      pending = true;
      requestAnimationFrame(refresh);
    }).observe(main,{childList:true,subtree:true,characterData:true});
    refresh();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded',initializeProgressColors,{once:true});
  } else {
    initializeProgressColors();
  }
})();
</script>

<script id="first-visit-intro">
(() => {
  'use strict';
  const key = 'network-intro-01076040-shown';
  let storage;
  try { storage = localStorage; if (storage.getItem(key)) return; }
  catch { try { storage = sessionStorage; if (storage.getItem(key)) return; } catch {} }
  const dialog = document.createElement('dialog');
  if (typeof dialog.showModal !== 'function') return;
  dialog.className = 'net-welcome';
  dialog.setAttribute('aria-labelledby','intro-heading');
  dialog.setAttribute('aria-describedby','intro-example');
  const hop = (label,path) => '<span class="intro-hop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="'+path+'"/></svg>'+label+'</span>';
  dialog.innerHTML = '<span class="course">Network Final Lab · 01076040</span>'+
    '<h2 id="intro-heading">จาก PC ไปถึง Gateway</h2>'+
    '<p id="intro-example">เมื่อปลายทางอยู่คนละ Subnet เครื่อง PC จะส่งเฟรมผ่านสวิตช์ไปหา Gateway ก่อน</p>'+
    '<div class="intro-network" aria-hidden="true">'+
    hop('PC','M3 4h18v13H3z M12 17v3 M7 20h10')+
    hop('Switch','M2 8h20v9H2z M5 12h2m2 0h2m2 0h2m2 0h2')+
    hop('Gateway','M2 12a10 7 0 1 0 20 0 10 7 0 1 0-20 0 M6 12h12m-3-3 3 3-3 3')+
    '<span class="intro-packet"></span></div>'+
    '<footer><span class="intro-state" role="status">กำลังเปิดบทเรียน…</span><button type="button" class="btn">ข้าม</button></footer>';
  document.body.append(dialog);
  let timer;
  const dismiss = () => {
    clearTimeout(timer);
    if (dialog.open) dialog.close();
    dialog.remove();
  };
  dialog.querySelector('button').addEventListener('click',dismiss,{once:true});
  dialog.addEventListener('cancel',event => { event.preventDefault(); dismiss(); },{once:true});
  try { dialog.showModal(); } catch { dialog.remove(); return; }
  try { storage?.setItem(key,'1'); } catch {}
  const start = performance.now();
  timer = setTimeout(dismiss,4000);
  document.addEventListener('DOMContentLoaded',() => {
    if (!dialog.open) return;
    dialog.querySelector('.intro-state').textContent = 'บทเรียนพร้อมแล้ว';
    dialog.querySelector('button').textContent = 'เข้าบทเรียน';
    const quiet = matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.motion === 'off';
    clearTimeout(timer);
    timer = setTimeout(dismiss,Math.max(0,(quiet ? 300 : 2250) - (performance.now()-start)));
  },{once:true});
})();
</script>
