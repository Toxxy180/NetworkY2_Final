<script id="reading-polish-script">

(() => {
  'use strict';
  const settingsKey = 'network-reading-preferences-v1';
  let settings = {theme:'light',large:false};
  try {
    const saved = JSON.parse(localStorage.getItem(settingsKey));
    if (saved && ['light','paper','dark'].includes(saved.theme)) settings.theme=saved.theme;
    settings.large = saved?.large === true;
  } catch {}
  const applySettings = () => {
    document.documentElement.dataset.theme=settings.theme;
    document.documentElement.style.setProperty('--reading-size',settings.large?'18px':'16px');
  };
  applySettings();
  document.addEventListener('DOMContentLoaded',() => {
    const tools = document.createElement('div');
    tools.className='study-tools';
    tools.setAttribute('role','group');
    tools.setAttribute('aria-label','ปรับการอ่าน');
    tools.innerHTML='<select aria-label="โทนสีสำหรับอ่าน"><option value="light">โทนสว่าง</option><option value="paper">โทนกระดาษ</option><option value="dark">โทนกลางคืน</option></select><span class="tools-separator" aria-hidden="true"></span><button type="button" class="size-button" aria-label="ขยายตัวอักษรในบทเรียน" aria-pressed="false">ก +</button><span class="tools-separator" aria-hidden="true"></span><button type="button" class="top-button" aria-label="กลับขึ้นด้านบน"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 12 6-6 6 6M12 6v14"/></svg>ด้านบน</button>';
    document.body.append(tools);
    const themeSelect=tools.querySelector('select');
    const sizeButton=tools.querySelector('.size-button');
    themeSelect.value=settings.theme;
    sizeButton.setAttribute('aria-pressed',String(settings.large));
    const persist=() => { applySettings();try{localStorage.setItem(settingsKey,JSON.stringify(settings));}catch{} };
    themeSelect.addEventListener('change',() => {settings.theme=themeSelect.value;persist();});
    sizeButton.addEventListener('click',() => {
      settings.large=!settings.large;
      sizeButton.setAttribute('aria-pressed',String(settings.large));
      persist();
    });
    tools.querySelector('.top-button').addEventListener('click',() => {
      const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({top:0,behavior:reduced?'instant':'smooth'});
    });
    const progress=document.createElement('div');
    progress.className='reading-progress';
    progress.setAttribute('aria-hidden','true');
    progress.innerHTML='<span></span>';
    document.body.append(progress);
    const fill=progress.firstElementChild;
    const main=document.getElementById('main');
    let sectionObserver;
    let scrollPending=false;
    const updateProgress=() => {
      const article=main.querySelector('.reading');
      progress.hidden=!article;
      if(article) {
        const rect=article.getBoundingClientRect();
        const distance=article.scrollHeight-window.innerHeight+100;
        const ratio=distance>0?Math.max(0,Math.min(1,(100-rect.top)/distance)):1;
        fill.style.transform='scaleX('+ratio+')';
      }
      scrollPending=false;
    };
    window.addEventListener('scroll',() => {
      if(!scrollPending){scrollPending=true;requestAnimationFrame(updateProgress);}
    },{passive:true});
    window.addEventListener('resize',updateProgress);
    const refresh=() => {
      main.classList.remove('page-enter');
      requestAnimationFrame(() => main.classList.add('page-enter'));
      sectionObserver?.disconnect();
      const links=[...main.querySelectorAll('.toc [data-scroll]')];
      if('IntersectionObserver' in window) {
        sectionObserver=new IntersectionObserver(entries => {
          const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
          if(!visible.length)return;
          links.forEach(link=>{
            const active=link.dataset.scroll===visible[0].target.id;
            link.classList.toggle('is-current',active);
            if(active)link.setAttribute('aria-current','location');
            else link.removeAttribute('aria-current');
          });
        },{rootMargin:'-100px 0px -45% 0px',threshold:0});
        main.querySelectorAll('.lesson-section').forEach(section=>sectionObserver.observe(section));
      }
      sizeButton.disabled=!main.querySelector('.reading');
      updateProgress();
    };
    new MutationObserver(refresh).observe(main,{childList:true});
    refresh();
  },{once:true});
})();

</script>

<script id="network-motion-script">

(() => {

    const main=document.getElementById('main');

      toggle.addEventListener('click',()=>{
        enabled=!enabled;
        document.documentElement.dataset.motion=enabled?'on':'off';
        toggle.setAttribute('aria-pressed',String(enabled));
        try{localStorage.setItem(motionKey,enabled?'on':'off');}catch{}
        if(!enabled) main.getAnimations({subtree:true}).forEach(a=>a.cancel());
      });
    }
    let revealObserver;

    const animate=(element,keyframes,options)=>{
      if(!canAnimate()||!element)return;
      return element.animate(keyframes,{duration:450,easing:'cubic-bezier(.22,.72,.2,1)',...options});
    };
    function routeLine() {
      if(!canAnimate())return;
      document.querySelectorAll('.fx-route-line').forEach(el=>el.remove());
      const line=document.createElement('div');
      line.className='fx-route-line';line.setAttribute('aria-hidden','true');
      document.body.append(line);
      const a=line.animate([
        {transform:'scaleX(0)',opacity:1,offset:0},

        {transform:'scaleX(1)',opacity:1,offset:.85},
        {transform:'scaleX(1)',opacity:0,offset:1}
      ],{duration:580,easing:'ease-out'});
      a.onfinish=()=>line.remove();
    }
    function packets() {
      const svg=main.querySelector('.hero-art svg');
      if(!svg||svg.querySelector('.fx-packets'))return;
      const ns='http://www.w3.org/2000/svg';

        circle.append(motion);group.append(circle);
      });
      svg.append(group);
    }
    function celebrate(element,large) {
      if(!canAnimate()||!element)return;
      const rect=element.getBoundingClientRect();
      const x=Math.max(25,Math.min(innerWidth-25,rect.left+rect.width/2));
      const y=Math.max(80,Math.min(innerHeight-80,rect.top+Math.min(60,rect.height/2)));
      const colors=['#1d927c','#56c9ab','#5d9ede','#d8ad59'];
      const count=large?34:12;
      for(let i=0;i<count;i++){
        const bit=document.createElement('i');
        bit.className='fx-piece';bit.setAttribute('aria-hidden','true');
        bit.style.left=x+'px';bit.style.top=y+'px';bit.style.background=colors[i%colors.length];
        document.body.append(bit);
        const direction=(Math.PI*2*i/count)-Math.PI/2;
        const distance=large?90+Math.random()*100:35+Math.random()*55;
        const dx=Math.cos(direction)*distance;
        const dy=Math.sin(direction)*distance;
        const spin=(Math.random()-.5)*650;
        const a=bit.animate([
          {transform:'translate(0,0) rotate(0deg) scale(.3)',opacity:0},
          {transform:'translate('+dx*.55+'px,'+(dy*.7-30)+'px) rotate('+spin*.5+'deg) scale(1)',opacity:1,offset:.35},
          {transform:'translate('+dx+'px,'+(dy+100)+'px) rotate('+spin+'deg) scale(.6)',opacity:0}
        ],{duration:large?1250:850,easing:'cubic-bezier(.2,.6,.35,1)',delay:i*7});
        a.onfinish=()=>bit.remove();
      }
    }
    function sectionReveals() {
      revealObserver?.disconnect();
      if(!canAnimate()||!('IntersectionObserver' in window))return;
      revealObserver=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(!entry.isIntersecting)return;
          revealObserver.unobserve(entry.target);
          animate(entry.target,[{opacity:.45,transform:'translateY(15px)'},{opacity:1,transform:'translateY(0)'}],{duration:520});
        });
      },{threshold:.04,rootMargin:'0px 0px -30px 0px'});
      main.querySelectorAll('.lesson-section').forEach(section=>revealObserver.observe(section));
    }
    function refresh() {
      pending=false;
      const heading=main.querySelector('h1')?.textContent||'';
      const view=location.hash+'|'+heading;
      if(view!==previousView){
        previousView=view;lastFeedback='';lastResult='';
        routeLine();
        animate(main.querySelector('.page-head')||main.querySelector('.hero'),[
          {opacity:.3,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}
        ],{duration:460});
        main.querySelectorAll('.chapter-card,.quiz-choice').forEach((card,index)=>{
          animate(card,[{opacity:.2,transform:'translateY(20px) scale(.98)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:460,delay:Math.min(index,7)*55});
        });
        packets();
        sectionReveals();
      }
      const question=main.querySelector('.question-panel h2')?.textContent||'';
      const feedback=main.querySelector('.feedback');
      const feedbackId=question+'|'+(feedback?.textContent||'');
      if(feedback&&feedbackId!==lastFeedback){
        lastFeedback=feedbackId;
        animate(feedback,[{opacity:0,transform:'translateY(10px) scale(.985)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:350});
        const chosen=main.querySelector('.option.selected');
        if(feedback.classList.contains('wrong')){
          animate(chosen,[{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:260});
        }else celebrate(feedback,false);
      }
      if(!feedback)lastFeedback='';
      const result=main.querySelector('.result-head');
      const resultId=result?.textContent||'';
      if(result&&resultId!==lastResult){
        lastResult=resultId;
        animate(result.querySelector('.score-circle'),[{transform:'scale(.65)',opacity:0},{transform:'scale(1.06)',opacity:1,offset:.75},{transform:'scale(1)',opacity:1}],{duration:620});
        if(parseInt(result.querySelector('.score-circle b')?.textContent,10)>=80)celebrate(result,true);
      }
    }
    const queueRefresh=()=>{if(!pending){pending=true;requestAnimationFrame(refresh);}};
    new MutationObserver(queueRefresh).observe(main,{childList:true});
    document.addEventListener('pointermove',event=>{
      if(!canAnimate()||event.pointerType!=='mouse')return;
      const card=event.target.closest('.chapter-card');
      if(!card)return;
      const rect=card.getBoundingClientRect();
      const x=(event.clientX-rect.left)/rect.width;
      const y=(event.clientY-rect.top)/rect.height;
      card.style.setProperty('--fx-x',Math.round(x*100)+'%');
      card.style.setProperty('--fx-y',Math.round(y*100)+'%');
      card.style.setProperty('--fx-rx',((.5-y)*3.5).toFixed(2)+'deg');
      card.style.setProperty('--fx-ry',((x-.5)*4).toFixed(2)+'deg');
      card.classList.add('fx-hover');
    },{passive:true});
    document.addEventListener('pointerout',event=>{
      const card=event.target.closest('.chapter-card');
      if(card&&!card.contains(event.relatedTarget))card.classList.remove('fx-hover');
    },{passive:true});
    document.addEventListener('pointerdown',event=>{
      if(!canAnimate()||!event.target.closest('.btn,.option,.chapter-card'))return;
      const wave=document.createElement('span');wave.className='fx-click-wave';
      wave.setAttribute('aria-hidden','true');wave.style.left=event.clientX+'px';wave.style.top=event.clientY+'px';
      document.body.append(wave);
      wave.addEventListener('animationend',()=>wave.remove(),{once:true});
      setTimeout(()=>wave.remove(),700);
    },{passive:true});
    refresh();
  },{once:true});
})();

</script>
